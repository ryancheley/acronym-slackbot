name: Django CI

on:
  push:
    branches-ignore:
      - main
      - dev

permissions: {}

jobs:

  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: github_actions
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python 3.15
      uses: actions/setup-python@v7.1.0
      with:
        python-version: '3.15'
    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        enable-cache: true
    - name: psycopg3 prerequisites
      run: sudo apt-get install python-dev-is-python3 libpq-dev
    - name: Install dependencies
      run: uv pip install --system . ".[dev]"
    - name: Run migrations
      run: python manage.py migrate
    - name: Load Fixtures
      run: |
        if [ -d "fixture" ]; then
            python manage.py loaddata fixture/*.json
        fi
    - name: Run tests
      uses: sjvrijn/pytest-last-failed@v2
      with:
        pytest-args: '--last-failed'

  # Fails when .github/workflows/actions.lock is out of sync with the
  # workflows or a locked pin no longer verifies upstream.
  lockfile:
    runs-on: ubuntu-slim
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - run: gh extension install github/gh-actions-lock --pin v0.4.1
    - run: gh actions-lock --verify
